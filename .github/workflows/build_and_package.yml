# .github/workflows/build_and_package.yml
name: Build and Package DEB

on:
  push:
    branches: [madlib2-master]
    tags: ['**']
  pull_request:
    branches: [madlib2-master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target_os: ubuntu
          target_os_version: '22.04'
          greengage_version: '6'
          extensions: 'deb ddeb'
        - target_os: ubuntu
          target_os_version: '24.04'
          greengage_version: '6'
          extensions: 'deb ddeb'
        - target_os: ubuntu
          target_os_version: '22.04'
          greengage_version: '7'
          extensions: 'deb ddeb'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # - name: Build Docker image
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: .
      #     file: ci/Dockerfile.${{ matrix.target_os }}
      #     push: false
      #     tags: madlib:${{ matrix.target_os }}${{ matrix.target_os_version }}-greengage${{ matrix.greengage_version }}
      #     build-args: |
      #       OS_VERSION=${{ matrix.target_os_version }}
      #       GREENGAGE_VERSION=${{ matrix.greengage_version }}

      - name: Build Docker image
        run: |
          case "${{ matrix.target_os }}" in
            ubuntu)
              mirror_ip=$(host azure.archive.ubuntu.com | awk '/has address/{print $NF; exit}')
              if curl -sf --max-time 5 "http://${mirror_ip}/ubuntu/" > /dev/null; then
                docker_options="--add-host=archive.ubuntu.com:${mirror_ip} --add-host=security.ubuntu.com:${mirror_ip}"
              fi
              ;;
          esac
          docker build $docker_options \
            --build-arg OS_VERSION=${{ matrix.target_os_version }} \
            --build-arg GREENGAGE_VERSION=${{ matrix.greengage_version }} \
            --tag madlib:${{ matrix.target_os }}${{ matrix.target_os_version }}-greengage${{ matrix.greengage_version }} \
            -f ci/Dockerfile.${{ matrix.target_os }} \
            .

      - name: Extract artifacts
        run: |
          mkdir -p artifacts
          docker create --name temp-container madlib:${{ matrix.target_os }}${{ matrix.target_os_version }}-greengage${{ matrix.greengage_version }}
          docker cp temp-container:/home/gpadmin/deb-packages artifacts/
          docker rm temp-container

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-packages-madlib${{ matrix.greengage_version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}
          path: artifacts/deb-packages/

      - name: Test deb package installation
        uses: greengagedb/greengage-ci/.github/actions/tests/install/deb@v45
        with:
          test_docker: '${{ matrix.target_os }}:${{ matrix.target_os_version }}'
          artifact_name: 'deb-packages-madlib${{ matrix.greengage_version }}-${{ matrix.target_os }}${{ matrix.target_os_version }}'
          add_greengage_repo: true
          verify_commands: |
            dpkg -l greengage${{ matrix.greengage_version }}-madlib &&
            /opt/greengagedb/greengage${{ matrix.greengage_version }}-madlib --version
